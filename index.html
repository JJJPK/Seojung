<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy I Love You Day</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1a0510 0%, #050104 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      user-select: none;
    }
    #ui-container {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
    #change-btn {
      pointer-events: auto;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: #ff3377;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
  </style>
  <!-- Three.js 및 애드온 로드용 Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui-container">
    <button id="change-btn">빵구 모양으로 바꾸기</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

    // 1. 씬, 카메라, 렌더러 초기화
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 42);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 2. 마우스/터치 컨트롤 설정
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.5;

    // 3. 조명 설정
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const pointLight1 = new THREE.PointLight(0xff3377, 4, 100);
    pointLight1.position.set(20, 20, 20);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0x7733ff, 3, 100);
    pointLight2.position.set(-20, -20, -20);
    scene.add(pointLight2);

    // 4. 텍스트 스프라이트 생성 함수 ('부와아아아앙' 등 긴 글자가 잘리지 않게 가로 폭 512로 설정)
    function createTextTexture(text, color) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;
      ctx.font = 'bold 44px sans-serif';
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      return new THREE.CanvasTexture(canvas);
    }

    // 5. 수식 기반 3D 텍스트 클라우드 구성
    const heartGroup = new THREE.Group();
    scene.add(heartGroup);

    const colors = ['#ff2266', '#ff6699', '#ff99bb', '#ffffff', '#ff3388'];

    // 기본(하트) 텍스트 머티리얼
    const words = ['사랑해', '빵구쟁이', '♥', '>3<', '뿡'];
    const materials = [];
    words.forEach((word, i) => {
      const texture = createTextTexture(word, colors[i % colors.length]);
      materials.push(new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        opacity: 0.85,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      }));
    });

    // 변경 후(빵구) 텍스트 머티리얼
    const fartWords = ['뿡뿡', '빵구', '부와아아아앙', ')) =3 (('];
    const fartMaterials = [];
    fartWords.forEach((word, i) => {
      const texture = createTextTexture(word, colors[i % colors.length]);
      fartMaterials.push(new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        opacity: 0.85,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      }));
    });

    // 빵구 모양(엉덩이 + 방귀 구름) 3D 좌표 생성 함수
    function createFartPos(index, total) {
      const ratio = index / total;
      // 30%: 왼쪽 엉덩이 두 짝 모양
      if (ratio < 0.3) {
        const isLeft = (index % 2 === 0);
        const u = Math.random() * Math.PI * 2;
        const v = Math.random() * Math.PI;
        const r = 4.0;
        const fx = -11 + Math.cos(u) * Math.sin(v) * (r * 0.8);
        const fy = Math.sin(u) * Math.sin(v) * (r * 1.1);
        const fz = (isLeft ? 2.5 : -2.5) + Math.cos(v) * r;
        return new THREE.Vector3(fx, fy, fz);
      }
      // 25%: 엉덩이에서 뿜어져 나오는 원뿔 기류 모양
      else if (ratio < 0.55) {
        const p = (ratio - 0.3) / 0.25;
        const angle = Math.random() * Math.PI * 2;
        const spread = (0.5 + p * 4.5) * Math.sqrt(Math.random());
        const fx = -8 + p * 10;
        const fy = Math.cos(angle) * spread;
        const fz = Math.sin(angle) * spread;
        return new THREE.Vector3(fx, fy, fz);
      }
      // 45%: 오른쪽 뭉게구름 덩어리 모양
      else {
        const centers = [
          new THREE.Vector3(7, 4.5, 0),
          new THREE.Vector3(10.5, -3.0, 2.0),
          new THREE.Vector3(9, 0.5, -3.0)
        ];
        const c = centers[index % 3];
        const r = 5.8 * Math.cbrt(Math.random());
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const fx = c.x + r * Math.sin(phi) * Math.cos(theta);
        const fy = c.y + r * Math.sin(phi) * Math.sin(theta);
        const fz = c.z + r * Math.cos(phi);
        return new THREE.Vector3(fx, fy, fz);
      }
    }

    const particleCount = 650;
    const sprites = [];

    for (let i = 0; i < particleCount; i++) {
      const t = Math.random() * Math.PI * 2;
      const p = Math.random() * Math.PI;

      // 3D 하트 곡면 수식
      const x = 16 * Math.pow(Math.sin(t), 3) * Math.sin(p);
      const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * Math.sin(p);
      const z = 6 * Math.cos(p);

      const scaleFactor = 0.85;
      const heartPos = new THREE.Vector3(x * scaleFactor, y * scaleFactor, z * scaleFactor);
      const fartPos = createFartPos(i, particleCount);

      const heartMat = materials[i % materials.length];
      const fartMat = fartMaterials[i % fartMaterials.length];

      const sprite = new THREE.Sprite(heartMat);
      sprite.position.copy(heartPos);
      sprite.scale.set(5.5, 1.5, 1);

      sprite.userData = {
        basePos: heartPos.clone(),
        heartPos: heartPos,
        fartPos: fartPos,
        heartMat: heartMat,
        fartMat: fartMat,
        phase: Math.random() * Math.PI * 2
      };

      heartGroup.add(sprite);
      sprites.push(sprite);
    }

    // 버튼 클릭 시 모양과 텍스트만 교체
    let isFart = false;
    const changeBtn = document.getElementById('change-btn');
    changeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isFart = !isFart;
      changeBtn.textContent = isFart ? '하트 모양으로 바꾸기' : '빵구 모양으로 바꾸기';

      sprites.forEach((sprite) => {
        if (isFart) {
          sprite.material = sprite.userData.fartMat;
          sprite.userData.basePos.copy(sprite.userData.fartPos);
        } else {
          sprite.material = sprite.userData.heartMat;
          sprite.userData.basePos.copy(sprite.userData.heartPos);
        }
        sprite.position.copy(sprite.userData.basePos);
      });
    });

    // 6. 중앙 3D 입체 폴리곤 텍스트 ("I LOVE YOU") 생성
    let centerMesh = null;
    const fontLoader = new FontLoader();
    fontLoader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
      const textGeo = new TextGeometry('I LOVE YOU', {
        font: font,
        size: 2.2,
        height: 0.6,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 0.15,
        bevelSize: 0.08,
        bevelOffset: 0,
        bevelSegments: 5
      });
      textGeo.center();

      const textMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xff1155,
        emissiveIntensity: 0.5,
        roughness: 0.2,
        metalness: 0.8
      });

      centerMesh = new THREE.Mesh(textGeo, textMat);
      scene.add(centerMesh);
    });

    // 7. 클릭/터치 시 심장 박동(Pulse) 인터랙션
    let pulseBoost = 0;
    window.addEventListener('pointerdown', () => {
      pulseBoost = 0.35;
    });

    // 8. 애니메이션 루프
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // 기본 두근거림 + 클릭 시 부스트 감쇠
      pulseBoost *= 0.92;
      const heartbeat = 1 + 0.05 * Math.sin(elapsedTime * 3.5) + pulseBoost;
      heartGroup.scale.set(heartbeat, heartbeat, heartbeat);

      // 개별 텍스트 스프라이트 미세 움직임
      sprites.forEach((sprite) => {
        const { basePos, phase } = sprite.userData;
        sprite.position.y = basePos.y + Math.sin(elapsedTime * 2 + phase) * 0.25;
      });

      if (centerMesh) {
        centerMesh.rotation.y = Math.sin(elapsedTime * 0.8) * 0.25;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 9. 반응형 화면 크기 조절
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
