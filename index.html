<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy I Love You Day</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #050104;
  background-image: radial-gradient(circle at center, #1a0510 0%, #050104 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: #ffffff;
  user-select: none;
  transition: background 0.8s ease;
}
body.fart-mode {
  background-color: #060801;
  background-image: radial-gradient(circle at center, #1f2408 0%, #060801 100%);
}
#ui-container {
  position: absolute;
  bottom: 40px;
  width: 100%;
  text-align: center;
  pointer-events: none;
  z-index: 10;
}
#toggle-btn {
  pointer-events: auto;
  background: linear-gradient(135deg, #ff2266, #ff6699);
  color: #ffffff;
  border: none;
  padding: 14px 28px;
  font-size: 1.05rem;
  font-weight: 700;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(255, 34, 102, 0.6);
  transition: transform 0.2s ease, background 0.4s ease, box-shadow 0.4s ease, color 0.4s ease;
}
#toggle-btn:hover {
  transform: scale(1.06);
}
#toggle-btn:active {
  transform: scale(0.95);
}
body.fart-mode #toggle-btn {
  background: linear-gradient(135deg, #99cc00, #ffcc00);
  color: #1a2200;
  box-shadow: 0 0 25px rgba(180, 255, 0, 0.7);
}
#error-box {
  display: none;
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 0, 50, 0.85);
  color: #fff;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 0.9rem;
  z-index: 100;
}
</style>
</head>
<body>
<div id="error-box"></div>
<div id="ui-container">
  <button id="toggle-btn">방구 모드로 변신 💨</button>
</div>

<script type="module">
// 에러 발생 시 화면에 표시하는 디버그 핸들러
window.addEventListener('error', (e) => {
  const errBox = document.getElementById('error-box');
  errBox.style.display = 'block';
  errBox.textContent = '오류 발생: ' + e.message;
});

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/+esm';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js/+esm';
import { FontLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FontLoader.js/+esm';
import { TextGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/geometries/TextGeometry.js/+esm';

// 1. 씬, 카메라, 렌더러 초기화
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 45);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// 2. 마우스/터치 컨트롤 설정
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;

// 3. 조명 설정
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0xff3377, 4, 100);
pointLight1.position.set(20, 20, 20);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x7733ff, 3, 100);
pointLight2.position.set(-20, -20, -20);
scene.add(pointLight2);

// 4. 텍스트 스프라이트 생성 함수
function createTextTexture(text, color) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 512;
  canvas.height = 128;
  ctx.font = 'bold 44px sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color;
  ctx.shadowBlur = 12;
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  return new THREE.CanvasTexture(canvas);
}

// 5. 하트 모드 & 방구 모드 머티리얼 생성
const heartGroup = new THREE.Group();
scene.add(heartGroup);

const heartWords = ['사랑해', '빵구쟁이', '♥', '>3<', '뿡'];
const heartColors = ['#ff2266', '#ff6699', '#ff99bb', '#ffffff', '#ff3388'];
const heartMaterials = heartWords.map((word, i) => {
  const texture = createTextTexture(word, heartColors[i % heartColors.length]);
  return new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    opacity: 0.85,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
});

const fartWords = ['뿡뿡', '빵구', '부와아아아앙', ')) =3 (('];
const fartColors = ['#bfff00', '#ffd700', '#88ff44', '#e6ff99'];
const fartMaterials = fartWords.map((word, i) => {
  const texture = createTextTexture(word, fartColors[i % fartColors.length]);
  return new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    opacity: 0.9,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
});

// 6. 방귀 모양(엉덩이 + 분출되는 방귀 구름) 3D 좌표 계산 함수
function getFartPosition(index, total) {
  const ratio = index / total;

  // 30%: 왼쪽 엉덩이 두 짝 ' )) ' 모양
  if (ratio < 0.3) {
    const isLeftCheek = (index % 2 === 0);
    const u = Math.random() * Math.PI * 2;
    const v = Math.random() * Math.PI;
    const r = 4.2 + (Math.random() - 0.5) * 0.6;

    const fx = -12 + Math.cos(u) * Math.sin(v) * (r * 0.85);
    const fy = Math.sin(u) * Math.sin(v) * (r * 1.15);
    const fz = (isLeftCheek ? 2.6 : -2.6) + Math.cos(v) * r;
    return { pos: new THREE.Vector3(fx, fy, fz), isCloud: false, progress: 0 };
  } else {
    // 70%: 오른쪽 방귀 제트 기류 및 구름 '=3' 모양
    const cloudRatio = (ratio - 0.3) / 0.7;
    const angle = Math.random() * Math.PI * 2;

    if (cloudRatio < 0.35) {
      const p = cloudRatio / 0.35;
      const spread = (0.4 + p * 4.5) * Math.sqrt(Math.random());
      const fx = -9 + p * 11;
      const fy = Math.cos(angle) * spread;
      const fz = Math.sin(angle) * spread;
      return { pos: new THREE.Vector3(fx, fy, fz), isCloud: true, progress: p * 0.5 };
    } else {
      const puffCenters = [
        new THREE.Vector3(8, 4.8, 0),
        new THREE.Vector3(11.5, -3.5, 2.2),
        new THREE.Vector3(10, 0.5, -3.5)
      ];
      const center = puffCenters[index % 3];
      const radius = 6.2 * Math.cbrt(Math.random());
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);

      const fx = center.x + radius * Math.sin(phi) * Math.cos(theta);
      const fy = center.y + radius * Math.sin(phi) * Math.sin(theta);
      const fz = center.z + radius * Math.cos(phi);
      return { pos: new THREE.Vector3(fx, fy, fz), isCloud: true, progress: 0.5 + Math.random() * 0.5 };
    }
  }
}

// 7. 파티클 생성 및 두 가지 상태 좌표 저장
const particleCount = 650;
const sprites = [];

for (let i = 0; i < particleCount; i++) {
  const t = Math.random() * Math.PI * 2;
  const p = Math.random() * Math.PI;
  const hx = 16 * Math.pow(Math.sin(t), 3) * Math.sin(p) * 0.85;
  const hy = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * Math.sin(p) * 0.85;
  const hz = 6 * Math.cos(p) * 0.85;
  const heartPos = new THREE.Vector3(hx, hy, hz);

  const fartData = getFartPosition(i, particleCount);

  const heartMat = heartMaterials[i % heartMaterials.length];
  const fartMat = fartMaterials[i % fartMaterials.length];

  const sprite = new THREE.Sprite(heartMat);
  sprite.position.copy(heartPos);
  sprite.scale.set(6.0, 1.5, 1);

  sprite.userData = {
    heartPos: heartPos,
    fartPos: fartData.pos,
    isCloud: fartData.isCloud,
    progress: fartData.progress,
    heartMat: heartMat,
    fartMat: fartMat,
    phase: Math.random() * Math.PI * 2
  };

  heartGroup.add(sprite);
  sprites.push(sprite);
}

// 8. 중앙 3D 입체 폴리곤 텍스트 ("I LOVE YOU" <-> "PPUNG! =3")
let heartCenterMesh = null;
let fartCenterMesh = null;

const fontLoader = new FontLoader();
fontLoader.load('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
  const heartGeo = new TextGeometry('I LOVE YOU', {
    font: font,
    size: 2.2,
    height: 0.6,
    curveSegments: 12,
    bevelEnabled: true,
    bevelThickness: 0.15,
    bevelSize: 0.08,
    bevelOffset: 0,
    bevelSegments: 5
  });
  heartGeo.center();
  const heartTextMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0xff1155,
    emissiveIntensity: 0.5,
    roughness: 0.2,
    metalness: 0.8
  });
  heartCenterMesh = new THREE.Mesh(heartGeo, heartTextMat);
  scene.add(heartCenterMesh);

  const fartGeo = new TextGeometry('PPUNG! =3', {
    font: font,
    size: 2.2,
    height: 0.6,
    curveSegments: 12,
    bevelEnabled: true,
    bevelThickness: 0.15,
    bevelSize: 0.08,
    bevelOffset: 0,
    bevelSegments: 5
  });
  fartGeo.center();
  const fartTextMat = new THREE.MeshStandardMaterial({
    color: 0xf0ffaa,
    emissive: 0x66aa00,
    emissiveIntensity: 0.6,
    roughness: 0.3,
    metalness: 0.6
  });
  fartCenterMesh = new THREE.Mesh(fartGeo, fartTextMat);
  fartCenterMesh.visible = false;
  scene.add(fartCenterMesh);
});

// 9. 버튼 클릭 시 모드 전환 이벤트
let isFartMode = false;
let pulseBoost = 0;
const toggleBtn = document.getElementById('toggle-btn');

toggleBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  isFartMode = !isFartMode;
  pulseBoost = 0.5;

  document.body.classList.toggle('fart-mode', isFartMode);
  toggleBtn.textContent = isFartMode ? '하트 모드로 돌아가기 ❤️' : '방구 모드로 변신 💨';

  sprites.forEach((sprite) => {
    sprite.material = isFartMode ? sprite.userData.fartMat : sprite.userData.heartMat;
  });

  if (heartCenterMesh && fartCenterMesh) {
    heartCenterMesh.visible = !isFartMode;
    fartCenterMesh.visible = isFartMode;
  }

  if (isFartMode) {
    pointLight1.color.setHex(0xaaff00);
    pointLight2.color.setHex(0xffaa00);
  } else {
    pointLight1.color.setHex(0xff3377);
    pointLight2.color.setHex(0x7733ff);
  }
});

window.addEventListener('pointerdown', () => {
  pulseBoost = 0.35;
});

// 10. 애니메이션 루프
const clock = new THREE.Clock();
const targetVec = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  pulseBoost *= 0.92;
  const freq = isFartMode ? 8.0 : 3.5;
  const heartbeat = 1 + 0.05 * Math.sin(elapsedTime * freq) + pulseBoost;
  heartGroup.scale.set(heartbeat, heartbeat, heartbeat);

  sprites.forEach((sprite) => {
    const { heartPos, fartPos, isCloud, progress, phase } = sprite.userData;

    if (isFartMode) {
      targetVec.copy(fartPos);
      if (isCloud) {
        const jetFlow = ((elapsedTime * 2.5 + progress) % 1.0) * 3.5;
        targetVec.x += jetFlow;
        targetVec.y += Math.sin(elapsedTime * 5 + phase) * 0.45;
        targetVec.z += Math.cos(elapsedTime * 4 + phase) * 0.45;
      } else {
        targetVec.y += Math.sin(elapsedTime * 12 + phase) * 0.15;
      }
    } else {
      targetVec.copy(heartPos);
      targetVec.y += Math.sin(elapsedTime * 2 + phase) * 0.25;
    }

    sprite.position.lerp(targetVec, 0.07);
  });

  if (heartCenterMesh) heartCenterMesh.rotation.y = Math.sin(elapsedTime * 0.8) * 0.25;
